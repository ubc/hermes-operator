image:
  repository: ghcr.io/ubc/hermes-operator
  # Leave empty to track the chart's appVersion. The release workflow publishes
  # v-prefixed image tags, so _helpers.tpl falls back to "v<appVersion>".
  # Pinning a bare version here yields an unpullable reference (see #113).
  tag: ""
  pullPolicy: IfNotPresent
logLevel: info
createRBAC: true
watchNamespaces: []
metrics:
  secure: true
# Manager health probes. controller-runtime serves /healthz and /readyz on this port
# (--health-probe-bind-address, passed explicitly so the flag and the probes cannot drift).
# /readyz also waits for the webhook server, so the pod only joins the webhook Service once
# admission (failurePolicy: Fail) can actually be served. Timings mirror the kubebuilder
# scaffold in config/manager/manager.yaml.
probes:
  port: 8081
  liveness:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 1
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
webhook:
  enabled: true
  port: 9443
  certManager:
    enabled: true
    issuerKind: Issuer
    issuerName: hermes-operator-selfsigned
  caBundle: ''
  servingCertSecretName: hermes-operator-webhook-server-cert
# NOTE: there are deliberately no agentImage or honchoImage defaults here.
# Both images are chosen per-instance on the HermesInstance: the agent via
# spec.image (the CRD requires an explicit tag or digest, because pinning a
# floating tag can silently pull a broken upstream build), and Honcho via
# spec.profileStore.honcho.image, which carries its own CRD-level default.
# Chart-level blocks for either were vestigial: nothing rendered them, and the
# agentImage one advertised an unpublished tag. See #113 and #128.
gatewayEgressEndpoints:
  telegram:
    - api.telegram.org
  discord:
    - discord.com
    - gateway.discord.gg
  slack:
    - slack.com
    - wss-primary.slack.com
  whatsapp:
    - graph.facebook.com
  signal:
    - chat.signal.org
